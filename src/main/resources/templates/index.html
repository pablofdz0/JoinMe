<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h1 th:text="${nombreApp}">Nombre de la app</h1>
    <p>Organiza tus viajes en grupo</p>

    <h2>Destinos disponibles: </h2>
    <ul>
        <li th:each="viaje : ${viajes}">
            <strong th:text = "${viaje.nombre}">Nombre</strong>
            <span th:text = "${viaje.destino}">Destino</span>
            (<span th:text = "${viaje.fechaInicio}">inicio</span> a
            <span th:text = "${viaje.fechaFin}">fin</span>
        </li>
    </ul>>
</body>
</html>
