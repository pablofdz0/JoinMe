<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h1 th:text="${nombreApp}">Nombre de la app</h1>
    <p>Organiza tus viajes en grupo</p>

    <h2>Viajes </h2>
    <p th:if="${#lists.isEmpty(viajes)}">No hay viajes disponibles</p>
    <ul th:unless="${#lists.isEmpty(viajes)}">
        <li th:each="viaje : ${viajes}">
            <strong th:text="${viaje.nombre}">Nombre</strong>
            <span th:text="${viaje.destino}">Destino</span>
            (<span th:text="${#temporals.format(viaje.fechaInicio, 'dd/MM/yyyy')}">inicio</span> a
            <span th:text="${#temporals.format(viaje.fechaFin, 'dd/MM/yyyy')}">fin</span>)
        </li>
    </ul>

    <a th:href="@{/viajes/nuevo}">+ Nuevo viaje</a>
</body>
</html>
